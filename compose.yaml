services:
  app:
    build: .
    env_file: .env
    volumes:
      # Volume nommé : Docker lui donne les droits de l'utilisateur `node` du conteneur
      # (un montage ./data appartiendrait à l'uid de l'hôte et ne serait pas inscriptible).
      - plantes-data:/app/data
    ports:
      - "127.0.0.1:3000:3000" # accès local pour le debug uniquement
    restart: unless-stopped

  # Reverse proxy HTTPS : certificat Let's Encrypt obtenu et renouvelé automatiquement.
  # Prérequis : DNS plantes.tvermorel.fr → IP publique, et ports 80/443 de la box redirigés vers ce serveur.
  caddy:
    image: caddy:2
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp" # HTTP/3
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data # certificats : à ne pas perdre (limites Let's Encrypt)
      - caddy-config:/config
    depends_on:
      - app
    restart: unless-stopped

volumes:
  plantes-data:
  caddy-data:
  caddy-config:
