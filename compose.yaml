# Rotation des journaux : sans limite, Docker les laisse grossir indéfiniment (3 × 10 Mo par conteneur au plus).
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  app:
    # Image construite par la CI ; `docker compose up --build` la reconstruit en local si besoin.
    image: ghcr.io/zoldik333/plantes:latest
    build: .
    env_file: .env
    volumes:
      # Volume nommé : Docker lui donne les droits de l'utilisateur `node` du conteneur
      # (un montage ./data appartiendrait à l'uid de l'hôte et ne serait pas inscriptible).
      - plantes-data:/app/data
    ports:
      - "127.0.0.1:3000:3000" # accès local pour le debug uniquement
    logging: *logging
    restart: unless-stopped

  # Reverse proxy HTTPS : certificat Let's Encrypt obtenu et renouvelé automatiquement.
  # Prérequis : DNS plantes.tvermorel.fr → IP publique, et ports 80/443 de la box redirigés vers ce serveur.
  caddy:
    image: caddy:2
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp" # HTTP/3
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data # certificats : à ne pas perdre (limites Let's Encrypt)
      - caddy-config:/config
    depends_on:
      - app
    logging: *logging
    restart: unless-stopped

volumes:
  plantes-data:
  caddy-data:
  caddy-config:
