name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck

  infra:
    # node1 applique compose.yaml, Caddyfile et scripts/ dès le `git pull`, sans attendre le reste de la CI :
    # on les valide donc ici, pour qu'une erreur de syntaxe ne coupe pas le site.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: compose.yaml
        run: touch .env && docker compose config -q
      - name: Caddyfile
        run: docker run --rm -v "$PWD/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2 caddy validate --config /etc/caddy/Caddyfile
      - name: Scripts shell
        run: for f in scripts/*.sh; do sh -n "$f" && echo "ok $f"; done

  test:
    # API, file de génération, rappels, logique d'arrosage : serveur réel + IA factice, sans réseau.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  test-ui:
    # Interface dans un vrai Chrome (écran d'iPhone), passkeys avec authentificateur virtuel.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CHROME_PATH: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: google-chrome --version
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:ui

  image:
    # Construit et publie l'image seulement sur main, et seulement si tout est vert ; node1 la tire (voir scripts/deploy.sh).
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [typecheck, infra, test, test-ui]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Construire l'image (sans la publier)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: plantes-smoke:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Vérifier que l'image démarre et fonctionne
        run: sh scripts/smoke-image.sh plantes-smoke:ci
      - name: Publier l'image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
          cache-from: type=gha
